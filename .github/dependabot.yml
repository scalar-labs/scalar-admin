version: 2
updates:
  # For Docker, update the base image pinned in the Dockerfile on the default branch
  # When a new Dockerfile is added, add its directory to the "directories" list below
  # Major version updates of the JRE base image are ignored because upgrading the Java runtime
  # of the released image is a manual decision; the other base image updates are grouped into a single PR
  - package-ecosystem: "docker"
    groups:
      container images on branch main:
        patterns:
          - "*"
    directories:
      - "/"
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: [ "version-update:semver-major" ]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "01:00"
      timezone: "Asia/Tokyo"
